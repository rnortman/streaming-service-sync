[package]
name = "streaming-service-sync"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Export a Pandora account to a local data repository and migrate it to Spotify, with LLM-assisted track matching"
license = "Apache-2.0"
repository = "https://github.com/rnortman/streaming-service-sync"
readme = "README.md"
keywords = ["pandora", "spotify", "migration", "playlist", "export"]
categories = ["command-line-utilities"]
include = ["/src", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE"]

[[bin]]
name = "sss"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
toml = "1.1.8"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
assert_cmd = "2.2.2"
httpmock = "0.8.3"
